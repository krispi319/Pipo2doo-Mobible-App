name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag, e.g. v1.4.1. Leave empty for the original test APK build.'
        required: false
        type: string
        default: ''
      replace_existing:
        description: 'Explicitly replace the selected release from this branch, only after a signed APK is ready.'
        required: false
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

jobs:

  prepare:
    name: Read release request
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.request.outputs.mode }}
      tag: ${{ steps.request.outputs.tag }}
      ref: ${{ steps.request.outputs.ref }}
    steps:
      - name: Read commit summary or selected release
        id: request
        shell: bash
        run: |
          python3 - <<'PY_REQUEST'
          import json, os, re
          from pathlib import Path
          event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          kind=os.environ['GITHUB_EVENT_NAME']
          mode,tag,ref='skip','',''
          if kind=='push':
              branch=event.get('repository',{}).get('default_branch','main')
              if event.get('ref')=='refs/heads/'+branch and not event.get('deleted',False):
                  first=event.get('head_commit',{}).get('message','').splitlines()
                  summary=first[0].strip() if first else ''
                  match=re.fullmatch(r'release:\s*(v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))',summary)
                  if match:
                      mode,tag,ref='create',match.group(1),event['after']
                      if not re.fullmatch(r'[0-9a-f]{40}',ref):
                          raise SystemExit('Invalid release commit SHA.')
                  elif summary.startswith('release:'):
                      raise SystemExit('Use the exact commit summary: release: v1.4.2')
          elif kind=='release':
              release=event['release']
              if not release.get('draft') and not release.get('prerelease'):
                  mode,tag='upload',release['tag_name']
          elif kind=='workflow_dispatch':
              tag=event.get('inputs',{}).get('release_tag','').strip()
              if tag:mode='upload'
              if str(event.get('inputs',{}).get('replace_existing','false')).lower()=='true':
                  if not tag:raise SystemExit('Replacement requires an existing release_tag.')
                  mode,ref='replace',os.environ['GITHUB_SHA']
          if mode!='skip':
              if not re.fullmatch(r'v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)',tag):
                  raise SystemExit('Use a stable version tag such as v1.4.2.')
              if mode=='upload':ref='refs/tags/'+tag
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f'mode={mode}\ntag={tag}\nref={ref}\n')
          print('Release request:',mode,tag or '(ordinary commit/manual test)')
          PY_REQUEST

  test:
    name: Build test APK (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Download project
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Check required files
        shell: bash
        run: |
          required=(
            gradlew
            gradle/wrapper/gradle-wrapper.jar
            mwm_private/app.properties
            mwm_private/build_icon_generation.gradle.kts
            mwm_private/build_screenshot_preview.gradle.kts
            app/google-services.json
          )
          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi
          done

      - name: Configure Android SDK
        shell: bash
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Install icon image tool
        run: |
          sudo apt-get update
          sudo apt-get install -y webp
          cwebp -version

      - name: Build test APK
        shell: bash
        run: |
          bash ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Pipo2doo-test-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Build signed release APK
    needs: prepare
    if: needs.prepare.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    concurrency:
      group: release-apk-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_MODE: ${{ needs.prepare.outputs.mode }}

    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo '::error::Use a stable numeric tag such as v1.4.1.'
            exit 1
          fi

      - name: Download the tagged project
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - name: Check destination release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY_DEST'
          import json, os, urllib.request, urllib.error
          repo=os.environ['GH_REPO'];tag=os.environ['RELEASE_TAG']
          def get(path):
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              try:
                  with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
              except urllib.error.HTTPError as e:
                  if e.code==404:return None
                  raise
          release=get('releases/tags/'+tag)
          if os.environ['RELEASE_MODE']=='create':
              if release is not None or get('git/ref/tags/'+tag) is not None:
                  raise SystemExit('This version/tag already exists. Use a NEW version in the release commit. For an existing release without an APK use the manual release_tag input.')
          elif release is None:
              raise SystemExit('The selected release does not exist. Create it first, or push a release commit for a new version.')
          if os.environ['RELEASE_MODE']=='replace':
              old_tag=get('git/ref/tags/'+tag)
              if old_tag is None or release.get('immutable',False):
                  raise SystemExit('Replacement needs an existing mutable release and tag.')
              with open(os.environ['GITHUB_ENV'],'a') as out:
                  out.write(f"REPLACED_RELEASE_ID={release['id']}\nREPLACED_TAG_SHA={old_tag['object']['sha']}\n")
          PY_DEST

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Check required project files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            gradlew
            gradle/wrapper/gradle-wrapper.jar
            mwm_private/app.properties
            mwm_private/build_icon_generation.gradle.kts
            mwm_private/build_screenshot_preview.gradle.kts
            app/google-services.json
            app/src/main/assets/supabase-client-config.json
          )
          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing required project file: $file"
              exit 1
            fi
          done

      - name: Check original signing key is configured
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Actions secret: $name. Use the original app signing key."
              exit 1
            fi
          done

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Install icon image tool
        run: |
          sudo apt-get update
          sudo apt-get install -y webp
          cwebp -version

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' 2>&1 | tee "$RUNNER_TEMP/pipo-release-build.log"

      - name: Check APK version and sign with original key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          tools="$ANDROID_HOME/build-tools/36.0.0"
          mapfile -t candidates < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk')
          if [[ "${#candidates[@]}" -ne 1 ]]; then
            echo '::error::Expected exactly one release APK.'
            exit 1
          fi
          "$tools/aapt" dump badging "${candidates[0]}" > "$RUNNER_TEMP/pipo-apk-badging.txt"
          python3 - <<'CHECK'
          import os, pathlib, re
          text=pathlib.Path(os.environ['RUNNER_TEMP'],'pipo-apk-badging.txt').read_text()
          package=re.search(r"^package: name='([^']+)' versionCode='([0-9]+)' versionName='([^']+)'",text,re.M)
          if not package:
              raise SystemExit('Could not read the built APK version.')
          if package.group(3)!=os.environ['RELEASE_TAG'][1:]:
              raise SystemExit('Release tag does not match APK versionName. Update app/build.gradle.kts and create a release from that commit.')
          if int(package.group(2))<=0:
              raise SystemExit('APK versionCode must be positive.')
          print('Built APK version matches the release tag.')
          CHECK
          mkdir -p "$RUNNER_TEMP/pipo-signing" dist
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pipo-signing/original.jks"
          "$tools/zipalign" -P 16 -f 4 "${candidates[0]}" "$RUNNER_TEMP/pipo-signing/aligned.apk"
          apk="dist/Pipo2doo-${RELEASE_TAG}.apk"
          "$tools/apksigner" sign \
            --ks "$RUNNER_TEMP/pipo-signing/original.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$apk" "$RUNNER_TEMP/pipo-signing/aligned.apk"
          "$tools/apksigner" verify "$apk"
          (cd dist && sha256sum "Pipo2doo-${RELEASE_TAG}.apk" > "Pipo2doo-${RELEASE_TAG}.apk.sha256")

      - name: Keep a workflow download copy
        uses: actions/upload-artifact@v6
        with:
          name: Pipo2doo-${{ env.RELEASE_TAG }}-signed-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Create release or attach APK to selected release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          apk="dist/Pipo2doo-${RELEASE_TAG}.apk"
          checksum="${apk}.sha256"
          if [[ "$RELEASE_MODE" == 'replace' ]]; then
            current_id="$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq .id)"
            current_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
            if [[ "$current_id" != "$REPLACED_RELEASE_ID" || "$current_sha" != "$REPLACED_TAG_SHA" ]]; then
              echo '::error::Release changed during the build. Replacement canceled.'
              exit 1
            fi
            source_commit="$(git rev-parse HEAD)"
            gh release delete "$RELEASE_TAG" --yes
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" -f sha="$source_commit" -F force=true > /dev/null
          fi
          if [[ "$RELEASE_MODE" == 'create' || "$RELEASE_MODE" == 'replace' ]]; then
            source_commit="$(git rev-parse HEAD)"
            gh release create "$RELEASE_TAG" "$apk" "$checksum" \
              --target "$source_commit" \
              --title "Pipo2doo ${RELEASE_TAG}" \
              --generate-notes --latest
          else
            gh release upload "$RELEASE_TAG" "$apk" "$checksum"
          fi

      - name: Keep build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Pipo2doo-${{ env.RELEASE_TAG }}-build-log
          path: ${{ runner.temp }}/pipo-release-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/pipo-signing"
